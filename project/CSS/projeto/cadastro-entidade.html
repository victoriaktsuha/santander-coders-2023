<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cadastro de Entidade - We Form</title>
    <link rel="stylesheet" href="styles.css" />
    <link
      rel="stylesheet"
      href="assets/fontawesome-free-6.4.0-web/css/all.css"
    />
  </head>
  <body>
    <header></header>
    <div class="content">
      <aside>
        <figure>
          <img src="assets/image.jpg" alt="" style="max-width: 500px" />
        </figure>
        <h1><span>We</span> Form</h1>
      </aside>
      <main>
        <header>
          <a href="index.html">
            <i class="fa-solid fa-angle-left"></i>
          </a>
          <h2>Nova <span>entidade</span></h2>
        </header>
        <form>
          <label for="input-name">Nome</label>
          <input type="text" id="input-name" />
          <div class="select-div">
            <label for="input-field">Campo de atuação</label>
            <select type="text" id="input-field">
              <option value="" selected disabled>Selecione um opção</option>
              <option value="abrigo">Abrigo de Animais</option>
            </select>
          </div>
          <div class="points">
            <label for="input-points">Pontos de coleta</label>
            <input type="text" id="input-points" />

            <button>
              <i class="fa-solid fa-circle-plus"></i>
            </button>
          </div>
        </form>
        <div class="actions">
          <a href="cadastro-entidade.html">Cadastrar </a>
        </div>
      </main>
    </div>
  </body>
</html>
